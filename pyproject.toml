[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "serenity-data-bridge"
version = "0.2.0"
description = "Read-only A-share and US-equity data bridge for research agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "wcheng2001-del"}]
dependencies = [
  "mcp==1.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.12"]

[project.scripts]
serenity-data = "serenity_data_bridge.cli:main"
serenity-data-mcp = "serenity_data_bridge.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
